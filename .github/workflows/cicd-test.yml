---
name: ♻️ Test

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Package
        id: package
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          make package
