---
name: ♻️ Test

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package
        id: package
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          make package
