---
name: ♻️ Test

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Package
        id: package
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          make package
